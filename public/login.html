<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | Lost2Found</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><header class="site-header"><a class="brand" href="/">Lost<span>2</span>Found</a><nav><a href="/">Back to explore</a></nav></header>
<main class="auth-layout wrap"><section class="auth-story"><p class="eyebrow">WELCOME BACK</p><h1>Your campus<br><em>connection point.</em></h1><p class="lead">Sign in to report an item, follow your claims and help belongings find their way home.</p></section>
<section class="auth-panel"><p class="eyebrow">STUDENT ACCESS</p><h2>Sign in</h2><p class="muted">Use your Sai University college email.</p><div id="authBanner"></div><form id="loginForm">

<label for="password">Password</label><input id="password" name="password" type="password" placeholder="Your password" required>
<div id="loginAlert" class="message" aria-live="polite"></div><button class="button full" id="loginSubmit" type="submit">Sign in</button></form>
<p class="auth-switch">New to Lost2Found? <a href="register.html">Create an account</a></p></section></main><script src="js/app.js"></script></body></html>
