<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Report an item | Lost2Found</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="/">Lost<span>2</span>Found</a><nav><a href="/">Explore</a><a href="dashboard.html">My dashboard</a><button class="link-button" onclick="logout()">Sign out</button></nav></header>
<main class="wrap form-page"><section class="form-heading"><p class="eyebrow">ADD TO THE COMMUNITY BOARD</p><h1>Help an item<br><em>find its way.</em></h1><p class="lead">Share a few details so the right person can recognise it.</p></section>
<form id="reportForm" class="report-form"><div class="form-row"><div><label for="listingType">I'm reporting</label><select id="listingType" required><option value="Lost">A lost item</option><option value="Found">A found item</option></select></div><div><label for="category">Category</label><select id="category" required><option value="">Choose category</option><option>Electronics</option><option>Books</option><option>Clothing</option><option>Accessories</option><option>ID Cards</option><option>Bags</option><option>Other</option></select></div></div>
<label for="title">Item name</label><input id="title" required maxlength="100" placeholder="e.g. Black water bottle">
<label for="description">Description</label><textarea id="description" rows="4" required maxlength="1000" placeholder="Describe colour, brand, identifying details..."></textarea>
<div class="form-row"><div><label for="location">Last seen / found at</label><input id="location" required maxlength="150" placeholder="e.g. Library, Block A"></div><div><label for="date">Date</label><input id="date" type="date" required></div></div>
<label for="imageUrl">Image URL <span class="muted">(optional)</span></label><input id="imageUrl" type="url" placeholder="https://...">
<div id="reportMessage" class="message" aria-live="polite"></div><button class="button" type="submit" id="reportSubmit">Submit report</button><a class="text-link" href="/">Cancel</a></form></main><footer class="site-footer"><span>Lost2Found · Sai University</span><span>Thank you for helping.</span></footer><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(!getStoredUser())location.href='login.html';const d=document.getElementById('date');if(d&&!d.value)d.value=new Date().toISOString().slice(0,10);});</script></body></html>
