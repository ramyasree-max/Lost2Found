<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | Lost2Found</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><header class="site-header"><a class="brand" href="/">Lost<span>2</span>Found</a><nav><a href="/">Back to explore</a></nav></header>
<main class="auth-layout wrap"><section class="auth-story"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Good things<br><em>find their way.</em></h1><p class="lead">Create your campus account to report lost and found items and manage your claims.</p></section>
<section class="auth-panel"><p class="eyebrow">NEW ACCOUNT</p><h2>Create account</h2><p class="muted">Register with your Sai University college email.</p>
<form id="registerForm"><label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Your name" required maxlength="80">
<label for="email">College email</label><input id="email" name="email" type="email" placeholder="Enter your college mail" required>
<label for="password">Password</label><input id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required>
<label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" placeholder="Re-enter password" required>
<div id="registerAlert" class="message" aria-live="polite"></div><button class="button full" type="submit" id="registerSubmit">Create account</button></form>
<p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p></section></main><script src="js/app.js"></script></body></html>
